{% extends "base.html" %}{% block title %}Register | EduLearn{% endblock %}{% block content %}
<div class="auth-wrap"><form class="panel auth" method="post"><span class="eyebrow">JOIN EDULEARN</span><h1>Create account</h1><p class="muted">Your next learning chapter begins here.</p><label>Full name</label><input name="name" required maxlength="80" placeholder="Your name"><label>Email address</label><input type="email" name="email" required placeholder="you@example.com"><label>Password</label><input type="password" name="password" required minlength="8" placeholder="At least 8 characters"><button class="btn primary full">Register</button><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></div>{% endblock %}
